name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned .ipa (Xcode 27)
    # AetherEngine needs Xcode 27 / Swift 6.4. `xcode-27` is GitHub's hosted image for it.
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project AtmosPlayer.xcodeproj \
            -scheme AtmosPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            TEST_MEDIA_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/TestMedia"

      - name: Ad-hoc sign with entitlements
        # The build is unsigned; signing it ad hoc records the App Group the widget shares with the
        # app, which Sideloadly carries over when it signs for your Apple ID.
        run: |
          APP=build/Build/Products/Release-iphoneos/AtmosPlayer.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements AtmosWidgets/AtmosWidgets.entitlements "$APP/PlugIns/AtmosWidgets.appex"
          codesign --force --sign - --entitlements AtmosPlayer/AtmosPlayer.entitlements "$APP"
          codesign -d --entitlements - "$APP" | head -20
          ls "$APP/PlugIns"

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/AtmosPlayer.app
          ls "$APP" "$APP/Frameworks"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AtmosPlayer.ipa Payload
          ls -lh AtmosPlayer.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AtmosPlayer-unsigned-ipa
          path: AtmosPlayer.ipa
          if-no-files-found: error

      - name: Publish for SideStore
        # Puts the .ipa on a fixed download link and writes the source file SideStore reads, so
        # a new build shows up in SideStore under My Apps > Updates.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          NOTES=$(git log -1 --pretty=%s)
          gh release view sidestore >/dev/null 2>&1 || \
            gh release create sidestore --title "Latest build" --notes "The newest Atmos Player build, for SideStore." --latest
          gh release upload sidestore AtmosPlayer.ipa --clobber
          gh release edit sidestore --notes "Atmos Player $VERSION: $NOTES"
          mkdir source
          cp AtmosPlayer/Assets.xcassets/AppIcon.appiconset/AppIcon.png source/icon.png
          VERSION="$VERSION" NOTES="$NOTES" REPO="${{ github.repository }}" OWNER="${{ github.repository_owner }}" \
          BUILD="${{ github.run_number }}" python3 - <<'PY'
          import json, os, datetime
          repo = os.environ["REPO"]
          raw = f"https://raw.githubusercontent.com/{repo}/source"
          download = f"https://github.com/{repo}/releases/download/sidestore/AtmosPlayer.ipa"
          size = os.path.getsize("AtmosPlayer.ipa")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          description = "Stremio streams with Dolby Atmos and Dolby Vision."
          version = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD"],
              "date": date,
              "localizedDescription": os.environ["NOTES"],
              "downloadURL": download,
              "size": size,
              "minOSVersion": "18.0",
          }
          app = {
              "name": "Atmos Player",
              "bundleIdentifier": "com.atmosplayer.app",
              "developerName": os.environ["OWNER"],
              "subtitle": "Atmos and Dolby Vision player",
              "localizedDescription": description,
              "iconURL": f"{raw}/icon.png",
              "tintColor": "6B66FF",
              "category": "entertainment",
              "screenshots": [],
              "versions": [version],
              "appPermissions": {"entitlements": [], "privacy": {}},
              # Older source readers look for these at the top level.
              "version": version["version"],
              "versionDate": date,
              "versionDescription": version["localizedDescription"],
              "downloadURL": download,
              "size": size,
          }
          source = {
              "name": "Atmos Player",
              "identifier": "com.atmosplayer.source",
              "subtitle": "Builds of Atmos Player",
              "iconURL": f"{raw}/icon.png",
              "sourceURL": f"{raw}/source.json",
              "apps": [app],
              "news": [],
          }
          json.dump(source, open("source/source.json", "w"), indent=2)
          PY
          cat source/source.json
          cd source
          git init -q -b source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "SideStore source for $VERSION"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" source

  preview:
    name: Simulator screenshots
    # Runs the app in the iOS Simulator and screenshots the main screens, so a build can be
    # looked at before it's sideloaded. Pushed to the `previews` branch (raw files are public).
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project AtmosPlayer.xcodeproj \
            -scheme AtmosPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            TEST_MEDIA_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/TestMedia"

      - name: Screenshot screens
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          phones = [d for d in devices if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]), phones[0])
          print(pick["udid"])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/AtmosPlayer.app
          mkdir -p shots
          shot() {
            screen=$1; wait=$2
            xcrun simctl terminate "$UDID" com.atmosplayer.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.atmosplayer.app -previewScreen "$screen"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$screen.png"
          }
          shot home 20
          shot detail 20
          shot stremio 8
          shot search 8
          shot search-results 14
          shot detail-fallback 16
          shot home-landscape 20
          shot detail-landscape 20
          xcrun simctl terminate "$UDID" com.atmosplayer.app 2>/dev/null || true
          xcrun simctl launch "$UDID" com.atmosplayer.app -previewScreen player
          sleep 7
          xcrun simctl io "$UDID" screenshot shots/player.png
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/player-later.png
          # The iPhone home screen, to check the app icon.
          xcrun simctl terminate "$UDID" com.atmosplayer.app 2>/dev/null || true
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/springboard.png
          xcrun simctl shutdown "$UDID" || true
          # The same screens on an iPad.
          PAD=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          pads = [d for d in devices if d["name"].startswith("iPad")]
          pick = next((d for d in pads if "Pro" in d["name"] and "11" in d["name"]), pads[0] if pads else None)
          print(pick["udid"] if pick else "")')
          if [ -n "$PAD" ]; then
            echo "iPad simulator: $PAD"
            xcrun simctl boot "$PAD"
            xcrun simctl bootstatus "$PAD" -b
            xcrun simctl ui "$PAD" appearance dark
            xcrun simctl install "$PAD" build/Build/Products/Debug-iphonesimulator/AtmosPlayer.app
            padshot() {
              screen=$1; wait=$2
              xcrun simctl terminate "$PAD" com.atmosplayer.app 2>/dev/null || true
              xcrun simctl launch "$PAD" com.atmosplayer.app -previewScreen "$screen"
              sleep "$wait"
              xcrun simctl io "$PAD" screenshot "shots/ipad-$screen.png"
            }
            padshot home 22
            padshot detail 22
            padshot stremio 8
            padshot search 8
            padshot home-landscape 22
            padshot detail-landscape 22
            padshot player 12
            xcrun simctl terminate "$PAD" com.atmosplayer.app 2>/dev/null || true
          fi
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots
          path: shots
          if-no-files-found: warn

      - name: Package the simulator app
        # For running the app in a browser (appetize.io: upload this zip, it runs in an iPhone simulator).
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent AtmosPlayer.app "$GITHUB_WORKSPACE/AtmosPlayer-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AtmosPlayer-simulator-app
          path: AtmosPlayer-simulator.zip
          if-no-files-found: warn

      - name: Publish to the previews branch
        run: |
          cd shots
          git init -q -b previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Screenshots of ${{ github.sha }}" > README.md
          git add -A
          git commit -qm "Screenshots of ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews

  test-media:
    name: Atmos test MKV
    # Dolby's public Atmos demo audio (E-AC-3 JOC), copied bit-for-bit into an MKV next to a
    # generated test picture. Kept as a build artifact for personal testing, not published.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build atmos-test.mkv
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          B=http://webapi.streaming.dolby.com/v0_9/sources/media/v01/dash/audio/en/ec-3/2
          curl -sf -o init.mp4 "$B/init.mp4"
          for i in 1 2 3 4 5 6 7; do curl -sf -o "seg-$i.m4s" "$B/seg-$i.m4s"; done
          cat init.mp4 seg-1.m4s seg-2.m4s seg-3.m4s seg-4.m4s seg-5.m4s seg-6.m4s seg-7.m4s > atmos.mp4
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=1280x720:rate=24" -i atmos.mp4 \
            -map 0:v -map 1:a -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -c:a copy -shortest atmos-test.mkv
          ffprobe -hide_banner atmos-test.mkv
      - uses: actions/upload-artifact@v4
        with:
          name: atmos-test-mkv
          path: atmos-test.mkv
          if-no-files-found: error

  hdr-test-media:
    name: HDR test clips
    # Synthetic test patterns (no third-party footage): grey patches at known brightness,
    # encoded as HDR10 (PQ), HLG and Dolby Vision Profile 8.1. Published once to the
    # "testmedia" release; the app's Links tab plays them to check HDR on the phone.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLIPS_VERSION: "1"
    steps:
      - name: Skip when already published
        id: check
        run: |
          notes=$(gh release view testmedia --json body -q '.body' 2>/dev/null || true)
          if echo "$notes" | grep -q "clips v$CLIPS_VERSION)"; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build HDR10 and HLG clips
        if: steps.check.outputs.skip != '1'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg mkvtoolnix fonts-dejavu-core
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          PQ="colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:range=limited:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400:hdr10=1:repeat-headers=1:log-level=error"
          HLG="colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc:range=limited:repeat-headers=1:log-level=error"
          # clip OUT "a b c d" (8-bit limited luma per patch) "l1|l2|l3|l4" TITLE TRC X265PARAMS
          clip() {
            out=$1; values=$2; labels=$3; title=$4; trc=$5; params=$6
            read -r a b c d <<< "$values"
            IFS='|' read -r l1 l2 l3 l4 <<< "$labels"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=black:s=1920x1080:r=24:d=10,format=yuv420p" \
              -vf "geq=lum='if(between(Y,170,770)*between(mod(X,480),40,440), if(lt(X,480),$a, if(lt(X,960),$b, if(lt(X,1440),$c,$d))), if(between(Y,860,920)*between(mod(X+N*12,1920),0,160),$d,16))':cb=128:cr=128,
                   drawtext=fontfile=$FONT:text='$title':x=60:y=70:fontsize=44:fontcolor=0x818181,
                   drawtext=fontfile=$FONT:text='$l1':x=80:y=790:fontsize=38:fontcolor=0x818181,
                   drawtext=fontfile=$FONT:text='$l2':x=560:y=790:fontsize=38:fontcolor=0x818181,
                   drawtext=fontfile=$FONT:text='$l3':x=1040:y=790:fontsize=38:fontcolor=0x818181,
                   drawtext=fontfile=$FONT:text='$l4':x=1520:y=790:fontsize=38:fontcolor=0x818181,
                   format=yuv420p10le" \
              -c:v libx265 -preset medium -crf 18 -pix_fmt yuv420p10le \
              -color_primaries bt2020 -color_trc "$trc" -colorspace bt2020nc -x265-params "$params" "$out"
          }
          # PQ code values for 100, 203, 400 and 1000 nits; the 100-nit patch matches the text.
          clip hdr10-test.mkv "127 143 159 181" "100 nits|203 nits|400 nits|1000 nits" \
            "HDR10 - patches brighter than this text means HDR is on" smpte2084 "$PQ"
          clip dv-base.hevc "127 143 159 181" "100 nits|203 nits|400 nits|1000 nits" \
            "Dolby Vision - patches brighter than this text means HDR is on" smpte2084 "$PQ"
          # HLG signal at 50%, 75% (reference white), 90% and 100%.
          clip hlg-test.mkv "126 180 213 235" "50 pct|75 pct = white|90 pct|100 pct" \
            "HLG - patches brighter than this text means HDR is on" arib-std-b67 "$HLG"
          ls -la hdr10-test.mkv hlg-test.mkv dv-base.hevc
      - name: Build Dolby Vision 8.1 clip
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        run: |
          set -e
          url=$(curl -sf https://api.github.com/repos/quietvoid/dovi_tool/releases/latest \
            | python3 -c 'import json,sys; print([a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if "x86_64-unknown-linux-musl" in a["name"]][0])')
          curl -sfL "$url" -o dovi.tar.gz && tar xzf dovi.tar.gz && chmod +x dovi_tool
          printf '%s' '{"cm_version":"V40","profile":"8.1","length":240,"level6":{"max_display_mastering_luminance":1000,"min_display_mastering_luminance":1,"max_content_light_level":1000,"max_frame_average_light_level":400}}' > dv.json
          ./dovi_tool generate -j dv.json -o RPU.bin
          ./dovi_tool inject-rpu -i dv-base.hevc --rpu-in RPU.bin -o dv.hevc
          mkvmerge -q -o dolby-vision-test.mkv --default-duration 0:24p dv.hevc
          mkvinfo dolby-vision-test.mkv | grep -i -E "dolby|dovi|block addition" || true
      - name: Publish clips
        if: steps.check.outputs.skip != '1'
        run: |
          gh release view testmedia >/dev/null 2>&1 || \
            gh release create testmedia --title "HDR test clips" --notes "Synthetic HDR test patterns." --latest=false
          gh release upload testmedia hdr10-test.mkv hlg-test.mkv --clobber
          if [ -f dolby-vision-test.mkv ]; then gh release upload testmedia dolby-vision-test.mkv --clobber; fi
          gh release edit testmedia --notes "Synthetic HDR test patterns (clips v$CLIPS_VERSION): grey patches at known brightness in HDR10, HLG and Dolby Vision 8.1."
