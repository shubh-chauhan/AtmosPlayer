name: AtmosPlayer
options:
  bundleIdPrefix: com.atmosplayer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  # AetherEngine with its optional components (Atmos heights, Dolby Vision extras) enabled.
  EngineBundle:
    path: EngineBundle
targets:
  AtmosPlayer:
    type: application
    platform: iOS
    sources:
      - AtmosPlayer
      - Shared
    dependencies:
      - package: EngineBundle
        product: EngineBundle
      - target: AtmosWidgets
    entitlements:
      path: AtmosPlayer/AtmosPlayer.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.atmosplayer.app
    scheme:
      testTargets:
        - AtmosPlayerTests
    info:
      path: AtmosPlayer/Info.plist
      properties:
        CFBundleDisplayName: Atmos Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.atmosplayer.app
            CFBundleURLSchemes:
              - atmosplayer
        TestMediaBase: $(TEST_MEDIA_BASE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atmosplayer.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TEST_MEDIA_BASE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Unit tests for the app's pure logic (metadata merging, artwork cropping). Run in CI on the simulator.
  AtmosPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AtmosPlayerTests
    dependencies:
      - target: AtmosPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  # Continue Watching widget and the playback Live Activity.
  AtmosWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AtmosWidgets
      - Shared
    info:
      path: AtmosWidgets/Info.plist
      properties:
        CFBundleDisplayName: Atmos Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AtmosWidgets/AtmosWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.atmosplayer.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atmosplayer.app.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
