name: AtmosPlayer
options:
  bundleIdPrefix: com.atmosplayer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.67.1
targets:
  AtmosPlayer:
    type: application
    platform: iOS
    sources:
      - AtmosPlayer
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    scheme: {}
    info:
      path: AtmosPlayer/Info.plist
      properties:
        CFBundleDisplayName: Atmos Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.atmosplayer.app
            CFBundleURLSchemes:
              - atmosplayer
        TestMediaBase: $(TEST_MEDIA_BASE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atmosplayer.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TEST_MEDIA_BASE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
